<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Dodge</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070d;color:white;font-family:Arial,Helvetica,sans-serif;touch-action:none}body{display:flex;align-items:center;justify-content:center}canvas{position:fixed;inset:0;width:100%;height:100%}#ui{position:fixed;inset:0;pointer-events:none}#score{position:absolute;top:20px;left:20px;font-size:22px;font-weight:bold;text-shadow:0 0 12px #35e8ff}#best{position:absolute;top:50px;left:20px;color:#8995a8;font-size:14px}#moneyTop{position:absolute;top:16px;right:15px;text-align:right;font-weight:bold;color:#ffd84a;text-shadow:0 0 12px rgba(255,216,74,.5);line-height:1.35;font-size:16px}#rateTop{font-size:13px;color:white}#withdrawTop{font-size:11px;color:#8995a8;font-weight:normal}#coinAnimation{position:absolute;top:75px;right:22px;color:#ffd84a;font-size:18px;font-weight:bold;opacity:0;text-shadow:0 0 15px rgba(255,216,74,.8)}#coinAnimation.show{animation:coinFloat 1.2s ease-out forwards}@keyframes coinFloat{0%{opacity:0;transform:translateY(15px) scale(.7)}20%{opacity:1;transform:translateY(0) scale(1.15)}70%{opacity:1;transform:translateY(-18px) scale(1)}100%{opacity:0;transform:translateY(-35px) scale(.9)}}#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,4,10,.78);backdrop-filter:blur(8px);pointer-events:auto}.panel{width:min(90%,420px);text-align:center;padding:34px 25px;border:1px solid rgba(53,232,255,.45);border-radius:22px;background:rgba(10,15,25,.9);box-shadow:0 0 35px rgba(53,232,255,.12),inset 0 0 25px rgba(53,232,255,.04)}h1{margin:0;font-size:42px;letter-spacing:3px;color:#35e8ff;text-shadow:0 0 20px rgba(53,232,255,.8)}.subtitle{margin:12px 0 28px;color:#9da9bd}button{border:0;border-radius:12px;padding:14px 28px;background:#35e8ff;color:#031015;font-size:17px;font-weight:bold;cursor:pointer;box-shadow:0 0 20px rgba(53,232,255,.35);margin:5px}button:active{transform:scale(.96)}#gameover,#shop{display:none}.final{color:#9da9bd;margin:12px 0 25px;line-height:1.7}#hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#69758a;font-size:13px;text-align:center;white-space:nowrap}.shopTitle{font-size:30px;color:#35e8ff;margin-bottom:8px;font-weight:bold}.shopCoins{color:#ffd84a;font-size:18px;font-weight:bold;margin-bottom:18px}.skinGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.skinCard{border:1px solid rgba(53,232,255,.2);border-radius:15px;padding:12px 8px;background:rgba(255,255,255,.025)}.skinPreview{width:38px;height:38px;border-radius:7px;margin:0 auto 8px;box-shadow:0 0 18px currentColor}.skinName{font-weight:bold;margin-bottom:5px}.skinPrice{color:#ffd84a;font-size:13px;margin-bottom:8px}.skinCard button{padding:9px 12px;font-size:13px;margin:0;width:100%}.skinCard button.selected{background:#35e8ff}.shopBack{background:#202a35;color:white;box-shadow:none}@media(max-width:600px){h1{font-size:35px}#score{font-size:20px}#moneyTop{font-size:14px;top:12px;right:10px}#rateTop{font-size:11px}#withdrawTop{font-size:10px}}
</style></head><body>
<canvas id="game"></canvas><div id="ui">
<div id="score">Счёт: 0</div><div id="best">Рекорд: 0</div>
<div id="moneyTop">🪙 <span id="coinBalance">0</span><div id="rateTop">100 монет = 2 рубля</div><div id="withdrawTop">За выводом- тг @sayonsgame</div></div><div id="coinAnimation">+1 🪙</div>
<div id="hint">Двигайся пальцем или используй WASD</div>
<div id="menu">
<div class="panel" id="startPanel"><h1>NEON DODGE</h1><div class="subtitle">Уклоняйся от препятствий</div><button onclick="startGame()">ИГРАТЬ</button><br><button onclick="openShop()">🛒 МАГАЗИН</button></div>
<div class="panel" id="gameover"><h1>GAME OVER</h1><div class="final">Счёт: <span id="finalScore">0</span><br>Рекорд: <span id="finalBest">0</span><br><span id="coinRewardText"></span></div><button onclick="startGame()">ИГРАТЬ СНОВА</button><button onclick="openShop()">🛒 МАГАЗИН</button></div>
<div class="panel" id="shop"><div class="shopTitle">🛒 МАГАЗИН</div><div class="shopCoins">🪙 <span id="shopCoinBalance">0</span> монет</div><div class="skinGrid">
<div class="skinCard"><div class="skinPreview" style="background:#35e8ff;color:#35e8ff"></div><div class="skinName">Голубой</div><div class="skinPrice">Бесплатно</div><button id="skinDefaultBtn" onclick="selectOrBuySkin('default')">ВЫБРАТЬ</button></div>
<div class="skinCard"><div class="skinPreview" style="background:#a855f7;color:#a855f7"></div><div class="skinName">Фиолетовый</div><div class="skinPrice">15 🪙</div><button id="skinPurpleBtn" onclick="selectOrBuySkin('purple')">КУПИТЬ</button></div>
<div class="skinCard"><div class="skinPreview" style="background:#ffd84a;color:#ffd84a"></div><div class="skinName">Жёлтый</div><div class="skinPrice">20 🪙</div><button id="skinYellowBtn" onclick="selectOrBuySkin('yellow')">КУПИТЬ</button></div>
<div class="skinCard"><div class="skinPreview" style="background:#ff315f;color:#ff315f"></div><div class="skinName">Красный</div><div class="skinPrice">25 🪙</div><button id="skinRedBtn" onclick="selectOrBuySkin('red')">КУПИТЬ</button></div>
<div class="skinCard"><div class="skinPreview" style="background:#ff8a2b;color:#ff8a2b"></div><div class="skinName">Оранжевый</div><div class="skinPrice">35 🪙</div><button id="skinOrangeBtn" onclick="selectOrBuySkin('orange')">КУПИТЬ</button></div></div><button class="shopBack" onclick="closeShop()">НАЗАД</button></div>
</div></div>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");let W=0,H=0;function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight}addEventListener("resize",resize);resize();
let player,obstacles,particles,running=false,score=0,best=Number(localStorage.getItem("neonDodgeBest")||0),coins=100,spawnTimer=0,lastTime=0,keys={};
let purchasedSkins=JSON.parse(localStorage.getItem("neonDodgePurchasedSkins")||'["default"]');if(!purchasedSkins.includes("default"))purchasedSkins.push("default");let selectedSkin=localStorage.getItem("neonDodgeSelectedSkin")||"default";if(!purchasedSkins.includes(selectedSkin))selectedSkin="default";
const skinData={default:{color:"#35e8ff",glow:"#35e8ff"},purple:{color:"#a855f7",glow:"#a855f7"},yellow:{color:"#ffd84a",glow:"#ffd84a"},red:{color:"#ff315f",glow:"#ff315f"},orange:{color:"#ff8a2b",glow:"#ff8a2b"}};const skinPrices={purple:15,yellow:20,red:25,orange:35};
document.getElementById("best").textContent="Рекорд: "+best;updateCoinDisplays();document.addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()))e.preventDefault()});document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
const pointer={active:false,x:0,y:0};canvas.addEventListener("pointerdown",e=>{pointer.active=true;pointer.x=e.clientX;pointer.y=e.clientY});canvas.addEventListener("pointermove",e=>{if(pointer.active){pointer.x=e.clientX;pointer.y=e.clientY}});canvas.addEventListener("pointerup",()=>pointer.active=false);canvas.addEventListener("pointercancel",()=>pointer.active=false);
function updateCoinDisplays(){coinBalance.textContent=coins;shopCoinBalance.textContent=coins}function saveProgress(){localStorage.setItem("neonDodgeBest",best);localStorage.setItem("neonDodgeCoins",coins);localStorage.setItem("neonDodgePurchasedSkins",JSON.stringify(purchasedSkins));localStorage.setItem("neonDodgeSelectedSkin",selectedSkin)}
function openShop(){menu.style.display="flex";startPanel.style.display="none";gameover.style.display="none";shop.style.display="block";updateCoinDisplays();updateShopButtons()}function closeShop(){shop.style.display="none";startPanel.style.display="block";gameover.style.display="none";menu.style.display="flex";updateCoinDisplays()}
function updateShopButtons(){["default","purple","yellow","red","orange"].forEach(s=>{let b=document.getElementById("skin"+s[0].toUpperCase()+s.slice(1)+"Btn");if(!b)return;if(selectedSkin===s){b.textContent="ВЫБРАН";b.classList.add("selected")}else if(purchasedSkins.includes(s)){b.textContent="ВЫБРАТЬ";b.classList.remove("selected")}else{b.textContent="КУПИТЬ "+skinPrices[s]+" 🪙";b.classList.remove("selected")}})}
function selectOrBuySkin(s){if(s!=="default"&&!purchasedSkins.includes(s)){let p=skinPrices[s];if(coins<p){alert("Недостаточно монет. Нужно "+p+" 🪙.");return}coins-=p;purchasedSkins.push(s)}selectedSkin=s;saveProgress();updateCoinDisplays();updateShopButtons()}
function showCoinReward(){coinAnimation.classList.remove("show");void coinAnimation.offsetWidth;coinAnimation.classList.add("show")}
function startGame(){menu.style.display="none";startPanel.style.display="none";gameover.style.display="none";shop.style.display="none";player={x:W/2,y:H-90,size:22,speed:360,skin:selectedSkin};obstacles=[];particles=[];score=0;spawnTimer=0;lastTime=performance.now();running=true;requestAnimationFrame(loop)}
function gameOver(){running=false;let finalScore=Math.floor(score),reward=0;if(finalScore>=500){coins++;reward=1;saveProgress();updateCoinDisplays();showCoinReward()}if(score>best)best=score;saveProgress();finalScoreEl.textContent=finalScore;finalBest.textContent=Math.floor(best);document.getElementById("best").textContent="Рекорд: "+Math.floor(best);coinRewardText.textContent=reward?"🎉 +1 монета за результат 500+":"За 500+ очков вы получите 1 монету";gameover.style.display="block";menu.style.display="flex";createExplosion(player.x,player.y)}
const finalScoreEl=document.getElementById("finalScore"),finalBest=document.getElementById("finalBest");
function spawnObstacle(){let size=18+Math.random()*34,x=size+Math.random()*(W-size*2),speed=190+Math.min(score*2,250)+Math.random()*100;obstacles.push({x,y:-size,size,speed,rotation:Math.random()*Math.PI,rotationSpeed:(Math.random()-.5)*4})}
function createExplosion(x,y){for(let i=0;i<25;i++){let a=Math.random()*Math.PI*2,s=80+Math.random()*260;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,size:2+Math.random()*4})}}
function update(dt){score+=dt*10;spawnTimer-=dt;if(spawnTimer<=0){spawnObstacle();spawnTimer=Math.max(.22,.7-score/1000)}let dx=0,dy=0;if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;if(keys.w||keys.arrowup)dy--;if(keys.s||keys.arrowdown)dy--;if(pointer.active){let px=pointer.x-player.x,py=pointer.y-player.y,d=Math.hypot(px,py);if(d>10){dx=px/d;dy=py/d}}let l=Math.hypot(dx,dy);if(l){dx/=l;dy/=l;player.x+=dx*player.speed*dt;player.y+=dy*player.speed*dt}player.x=Math.max(player.size,Math.min(W-player.size,player.x));player.y=Math.max(player.size,Math.min(H-player.size,player.y));for(let i=obstacles.length-1;i>=0;i--){let o=obstacles[i];o.y+=o.speed*dt;o.rotation+=o.rotationSpeed*dt;if(o.y-o.size>H){obstacles.splice(i,1);continue}if(Math.hypot(o.x-player.x,o.y-player.y)<o.size*.75+player.size*.55){createExplosion(player.x,player.y);gameOver();return}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97;p.life-=dt*1.8;if(p.life<=0)particles.splice(i,1)}}
function drawBackground(){ctx.fillStyle="#05070d";ctx.fillRect(0,0,W,H);let g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H));g.addColorStop(0,"rgba(20,60,80,.22)");g.addColorStop(1,"rgba(0,0,0,.2)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle="rgba(53,232,255,.045)";ctx.lineWidth=1;for(let x=0;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}
function drawPlayer(){let s=skinData[player.skin]||skinData.default;ctx.save();ctx.shadowBlur=25;ctx.shadowColor=s.glow;ctx.fillStyle=s.color;ctx.beginPath();ctx.roundRect(player.x-player.size/2,player.y-player.size/2,player.size,player.size,5);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(player.x-4,player.y-4,2,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawObstacle(o){ctx.save();ctx.translate(o.x,o.y);ctx.rotate(o.rotation);ctx.shadowBlur=20;ctx.shadowColor="#ff315f";ctx.fillStyle="#ff315f";ctx.fillRect(-o.size/2,-o.size/2,o.size,o.size);ctx.shadowBlur=0;ctx.strokeStyle="#ffb1c1";ctx.lineWidth=2;ctx.strokeRect(-o.size/2,-o.size/2,o.size,o.size);ctx.restore()}
function drawParticles(){for(const p of particles){ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle="#35e8ff";ctx.shadowBlur=12;ctx.shadowColor="#35e8ff";ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.restore()}}
function draw(){drawBackground();for(const o of obstacles)drawObstacle(o);if(player)drawPlayer();drawParticles();document.getElementById("score").textContent="Счёт: "+Math.floor(score)}function loop(time){if(!running){drawParticles();return}let dt=Math.min((time-lastTime)/1000,.033);lastTime=time;update(dt);draw();if(running)requestAnimationFrame(loop)}draw();
</script></body></html>
